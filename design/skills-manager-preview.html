<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Hub · Skills 管理器设计预览</title>
<style>
:root{color-scheme:dark;--canvas:#101522;--panel:#171d2c;--panel2:#1b2334;--line:#2b3449;--text:#e6e9f2;--muted:#a0abc2;--brand:#818cf8;--soft:#242b4f;--success:#6ee7b7;--field:#111828;font-family:'Segoe UI','Microsoft YaHei',sans-serif;font-size:13px}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;color:var(--text)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:3px}button:disabled{cursor:default;opacity:.5}button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 12px}button:hover{border-color:var(--brand)}.primary{background:#4f46e5;border-color:#6366f1;color:#fff}.ghost{background:transparent}.muted{color:var(--muted)}.small{font-size:12px}.titlebar{height:38px;display:flex;justify-content:center;align-items:center;background:#0b0f1a;color:#b6bfd2;gap:12px;border-bottom:1px solid #232a3d}.titlebar span{color:#818ea6;font-size:11px}.shell{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:calc(100vh - 38px)}aside{background:#0b0f1a;padding:24px 18px;color:#8b93a7}.brand{display:flex;gap:10px;align-items:center;margin-bottom:32px}.brand-icon{background:#262748;color:#c7caff;padding:8px;border-radius:9px;font-weight:700}.brand strong{display:block;color:#e6e9f2;font-size:15px}.brand small{display:block;margin-top:4px;font-size:10px;letter-spacing:.6px}.group-label{font-size:11px;margin:24px 10px 9px;color:#818ba0}.side-item{display:block;width:100%;text-align:left;background:transparent;border:0;color:#a0abc2;padding:11px 12px;margin:2px 0}.side-item.active{background:#25264a;color:#c7caff}.side-footer{margin:42px 10px 0;border-top:1px solid #293044;padding-top:17px;font-size:11px;line-height:1.8;color:#a0abc2}.content{padding:26px 28px;min-width:0}.top{display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:23px;font-weight:650}h2{font-size:17px;margin:0}h3{font-size:13px;margin:22px 0 10px}p{line-height:1.8;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{font-size:12px;color:var(--muted);margin:8px 0 24px}.bar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}input,select,textarea{color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}input[type=search]{flex:1;min-width:180px}input[type=checkbox]{accent-color:#6366f1}.filters{display:flex;border-bottom:1px solid var(--line);gap:20px;margin-bottom:18px;flex-wrap:wrap}.filter,.tab{background:transparent;border:0;border-radius:0;padding:11px 0;color:var(--muted)}.filter.active,.tab.active{color:var(--brand);border-bottom:2px solid var(--brand)}.filter:hover,.tab:hover{border-color:var(--brand)}.workspace{display:grid;grid-template-columns:minmax(245px,.85fr) minmax(0,1.5fr);gap:18px;align-items:start}.list{display:grid;gap:10px}.skill-row{width:100%;text-align:left;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.skill-row.selected{border-color:var(--brand);background:var(--soft)}.row-top{display:flex;justify-content:space-between;gap:10px;align-items:start}.skill-name{font-size:14px;font-weight:600;display:block}.slug{color:var(--muted);font-family:Consolas,monospace;font-size:11px;display:block;margin-top:5px;overflow-wrap:anywhere}.skill-row p{font-size:12px;color:var(--muted);line-height:1.7;margin:13px 0}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;background:var(--panel2);padding:3px 7px;border-radius:4px;color:var(--muted);border:1px solid var(--line)}.tag.enabled{color:var(--success)}.detail{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}.detail-head{padding:21px 22px 0}.detail-head .slug{margin:7px 0 14px}.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);flex-wrap:wrap}.detail-body{padding:4px 22px 22px;min-height:360px}.feature-list{padding-left:18px;color:var(--muted);line-height:2}.code{font-family:Consolas,'Microsoft YaHei',monospace;background:var(--field);border-radius:8px;padding:13px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}.meta{display:grid;grid-template-columns:76px minmax(0,1fr);gap:9px;font-size:12px}.meta dt{color:var(--muted)}.meta dd{margin:0;overflow-wrap:anywhere}.detail-bottom{border-top:1px solid var(--line);padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.target-row{border-bottom:1px solid var(--line);padding:14px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}.target-row:last-child{border-bottom:0}.target-row p{margin:3px 0;font-size:12px;color:var(--muted)}.target-row .actions{flex-shrink:0}.target-status{color:var(--success);font-size:11px}.file-layout{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;margin-top:18px}.file-menu button{display:block;width:100%;text-align:left;padding:8px 6px;border:0;background:transparent;font-size:11px;overflow-wrap:anywhere}.file-menu .active{color:var(--brand);background:var(--soft)}.pill{color:var(--brand);font-size:11px;border:1px solid var(--line);padding:4px 7px;border-radius:6px;white-space:nowrap}.empty{padding:22px;color:var(--muted);font-size:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:85vw;background:var(--panel2);color:var(--text);border:1px solid var(--brand);padding:12px 18px;border-radius:9px;z-index:10;box-shadow:0 6px 30px #0004}.toast[hidden]{display:none}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(620px,calc(100vw - 32px));max-height:85vh;overflow:auto}dialog::backdrop{background:#080b14b0}.dialog-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.source-tabs{display:flex;gap:7px;margin:22px 0 17px;flex-wrap:wrap}.source-tabs .active{background:var(--soft);border-color:var(--brand)}label.field{display:grid;gap:8px;font-size:12px;color:var(--muted)}.import-box{border:1px dashed var(--line);padding:20px;border-radius:10px;text-align:center;margin:14px 0;background:var(--field)}.form-section{margin:19px 0}.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.check{display:flex;align-items:center;gap:7px;color:var(--text);font-size:12px}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.light{color-scheme:light;--canvas:#f5f6fa;--panel:#fff;--panel2:#f5f6fb;--line:#e1e5ee;--text:#20283c;--muted:#64708a;--brand:#4f46e5;--soft:#eeedff;--success:#047857;--field:#f4f6fa}
@media(min-width:1400px){.content{max-width:1400px;width:100%;margin:auto}}@media(max-width:1090px){.workspace{grid-template-columns:minmax(210px,.75fr) minmax(0,1.2fr)}.shell{grid-template-columns:185px minmax(0,1fr)}aside{padding:24px 12px}.content{padding:24px 18px}.detail-head,.detail-body{padding-left:16px;padding-right:16px}.file-layout{grid-template-columns:1fr}.file-menu{display:flex;flex-wrap:wrap;gap:5px}.file-menu button{width:auto}}@media(max-width:800px){.workspace{grid-template-columns:1fr}.shell{grid-template-columns:155px minmax(0,1fr)}aside{padding:20px 8px}.brand{gap:7px}.brand strong{font-size:13px}.brand small{font-size:9px}.side-item{padding:10px 8px}.content{padding:20px 14px}.list{grid-template-columns:1fr}.top .actions{width:100%}.detail-body{min-height:0}}@media(max-width:520px){.shell{display:block}aside{padding:14px}.brand,.side-footer,.group-label{display:none}.side-item{display:none}.side-item.active{display:block}.content{padding:16px 12px}.checks{grid-template-columns:1fr}.filters{gap:13px}.tabs{gap:12px}h1{font-size:21px}.target-row{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="titlebar">Project Hub <span>界面草图 · 示例状态 · 不读写本机文件</span></div>
<div class="shell">
<aside aria-label="应用导航">
  <div class="brand"><div class="brand-icon">PH</div><div><strong>Project Hub</strong><small>DEVELOPER WORKSPACE</small></div></div>
  <div class="group-label">工作台</div>
  <button class="side-item" type="button">项目总览</button><button class="side-item" type="button">本机服务</button><button class="side-item" type="button">镜像与服务器</button><button class="side-item" type="button">AI 磁盘管家</button>
  <div class="group-label">AI</div><button class="side-item active" type="button">Skills 管理</button><button class="side-item" type="button">AI 服务</button>
  <div class="group-label">系统</div><button class="side-item" type="button">全局设置</button>
  <div class="side-footer">本机技能库<br>为不同 AI 工具统一管理技能<br><button class="ghost" id="theme" type="button" style="margin-top:13px">切换外观</button></div>
</aside>
<main class="content">
  <div class="top"><div><h1>Skills 管理</h1><p class="muted small">收集技能，了解用途，安装到你的 AI 工具。</p></div><div class="actions"><button id="scan" type="button">扫描本机</button><button class="primary" id="import" type="button">＋ 导入技能</button></div></div>
  <div class="notice">支持 Codex · OpenCode · Antigravity · Project Hub AI</div>
  <div class="bar"><input id="search" type="search" placeholder="搜索名称、用途或标签…" aria-label="搜索技能"><select id="tool" aria-label="筛选安装目标"><option value="all">全部目标</option><option>Codex</option><option>OpenCode</option><option>Antigravity</option><option>Project Hub AI</option></select><select id="source" aria-label="筛选来源"><option value="all">全部来源</option><option>本地导入</option><option>GitHub</option><option>本机发现</option></select></div>
  <div class="filters" id="filters" role="tablist" aria-label="技能状态"><button class="filter active" type="button" data-filter="all" role="tab" aria-selected="true">全部</button><button class="filter" type="button" data-filter="installed" role="tab" aria-selected="false">已安装</button><button class="filter" type="button" data-filter="uninstalled" role="tab" aria-selected="false">未安装</button><button class="filter" type="button" data-filter="update" role="tab" aria-selected="false">待更新</button></div>
  <div class="workspace"><section class="list" id="list" aria-label="技能列表"></section><section class="detail" id="detail" aria-label="技能详情"></section></div>
</main>
</div>
<dialog id="import-dialog" aria-labelledby="import-title">
  <div class="dialog-head"><h2 id="import-title">导入技能</h2><button class="ghost" id="close-dialog" type="button" aria-label="关闭">关闭</button></div>
  <div class="source-tabs" id="import-tabs"><button type="button" class="active" data-source="github">GitHub</button><button type="button" data-source="web">下载链接</button><button type="button" data-source="local">本地文件</button><button type="button" data-source="existing">已有技能</button></div>
  <div id="import-source"></div>
  <div class="form-section"><h3>安装到</h3><div class="checks"><label class="check"><input type="checkbox" value="Codex" checked>Codex</label><label class="check"><input type="checkbox" value="OpenCode">OpenCode</label><label class="check"><input type="checkbox" value="Antigravity">Antigravity</label><label class="check"><input type="checkbox" value="Project Hub AI">Project Hub AI</label></div><label class="field">使用范围<select id="scope"><option value="global">全局 · 所有项目</option><option value="project">项目 · 选择指定项目</option><option value="library">仅加入技能库</option></select></label><div id="project-field" hidden style="margin-top:12px"><label class="field">目标项目<select><option>Project Hub（示例项目）</option><option>另一个项目（示例项目）</option></select></label></div></div>
  <p class="muted small">实际导入会先识别技能、预览文件，再处理同名冲突。此处只展示交互，不会下载或安装。</p>
  <div class="dialog-foot"><button id="cancel-import" type="button">取消</button><button id="preview-import" type="button" class="primary">预览导入</button></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
const skills=[
 {id:'github-release-desktop',title:'GitHub 安装包发布',desc:'构建桌面安装包、校验发布产物，并通过 GitHub Releases 分发。',source:'本地导入',category:'构建与发布',installed:['Codex'],scope:'全局',version:'本地快照',update:false,files:['SKILL.md','agents/openai.yaml','references/electron.md'],tasks:['准备 Windows 安装包与校验文件','整理更新说明、创建草稿或正式 Release','上传后验证下载文件与本地 SHA-256'],deps:'electron-builder、GitHub CLI 或 GitHub 工具、目标平台构建环境',call:'使用 $github-release-desktop，为当前项目构建 Windows 安装包，仅准备发布。'},
 {id:'imagegen',title:'图片生成与编辑',desc:'根据描述或参考图生成图片，编辑已有图片并产出可用素材。',source:'本机发现',category:'设计素材',installed:['Codex'],scope:'全局',version:'已发现',update:false,files:['SKILL.md'],tasks:['生成说明图、插画或产品素材','根据参考图生成变体','按要求编辑图片'],deps:'目标工具需要图片生成能力；安装文件不等于获得生成接口',call:'使用图片生成技能，为项目制作一张介绍插画。'},
 {id:'code-review-demo',title:'代码审查',desc:'检查代码变更中的行为问题、边界条件与验证缺口。',source:'GitHub',category:'开发质量',installed:[],scope:'未安装',version:'示例提交',update:false,files:['SKILL.md','references/checklist.md'],tasks:['审查当前项目的代码变更','解释潜在问题与触发条件','提供具体修复建议'],deps:'项目文件读取、Git diff；来源及修订需要实际确认',call:'审查当前项目的未提交改动，列出需要修复的问题。'},
 {id:'project-docs-demo',title:'项目文档整理',desc:'从项目结构提炼使用说明、架构说明和开发指南。',source:'GitHub',category:'项目文档',installed:['Project Hub AI'],scope:'当前项目',version:'示例提交',update:true,files:['SKILL.md','assets/template.md'],tasks:['解释项目目录和模块职责','整理开发环境与启动步骤','按模板生成项目说明'],deps:'项目文件读取；输出文件需要运行器提供写入工具',call:'使用项目文档技能，解释当前项目的结构与启动方式。'}
];
let selected=skills[0].id,filter='all',tab='overview',file='SKILL.md',timer;
const targets=['Codex','OpenCode','Antigravity','Project Hub AI'];
const $=id=>document.getElementById(id);
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,4200)}
function renderList(){
 const q=$('search').value.trim().toLowerCase(),tool=$('tool').value,source=$('source').value;
 const shown=skills.filter(s=>(!q||[s.title,s.id,s.desc,s.category].join(' ').toLowerCase().includes(q))&&(tool==='all'||s.installed.includes(tool))&&(source==='all'||s.source===source)&&(filter==='all'||filter==='installed'&&s.installed.length||filter==='uninstalled'&&!s.installed.length||filter==='update'&&s.update));
 $('list').innerHTML=shown.map(s=>`<button type="button" class="skill-row ${selected===s.id?'selected':''}" data-id="${esc(s.id)}" aria-pressed="${selected===s.id}"><span class="row-top"><span><span class="skill-name">${esc(s.title)}</span><span class="slug">${esc(s.id)}</span></span>${s.update?'<span class="pill">待更新</span>':''}</span><p>${esc(s.desc)}</p><span class="tags"><span class="tag">${esc(s.source)}</span>${s.installed.length?s.installed.map(t=>`<span class="tag enabled">${esc(t)}</span>`).join(''):'<span class="tag">未安装</span>'}</span></button>`).join('')||'<div class="empty">没有匹配的技能，试试其他筛选条件。</div>';
}
function renderDetail(){
 const s=skills.find(s=>s.id===selected);let body='';
 if(tab==='overview')body=`<h3>能帮你做什么</h3><p>${esc(s.desc)}</p><ul class="feature-list">${s.tasks.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><h3>调用示例</h3><div class="code">${esc(s.call)}</div><h3>所需工具与能力</h3><p class="muted small">${esc(s.deps)}</p><dl class="meta"><dt>来源</dt><dd>${esc(s.source)}</dd><dt>版本</dt><dd>${esc(s.version)}</dd><dt>使用范围</dt><dd>${esc(s.scope)}</dd></dl>`;
 if(tab==='content'){
  const content=file==='SKILL.md'?`---\nname: ${s.id}\ndescription: ${s.desc}\n---\n\n# ${s.title}\n\n${s.tasks.map(t=>'- '+t).join('\n')}\n\n此处为结构展示摘要，正式管理器会读取完整原文。`:file==='agents/openai.yaml'?`interface:\n  display_name: "${s.title}"\n  short_description: "${s.desc}"\n\n（结构示例）`:`# ${file}\n\n这里展示所选引用文件的内容。\n正式管理器提供完整文件树、原文和 Markdown 预览。`;
  body=`<div class="file-layout"><nav class="file-menu" aria-label="技能文件">${s.files.map(f=>`<button type="button" data-file="${esc(f)}" class="${file===f?'active':''}">${esc(f)}</button>`).join('')}</nav><div><p class="small muted">${esc(file)} · 原文示例</p><pre class="code">${esc(content)}</pre></div></div>`;
 }
 if(tab==='targets')body=`<p class="muted small">每个目标分别管理范围和状态；共享目录需要显示关联影响。</p>${targets.map(t=>{const on=s.installed.includes(t);return `<div class="target-row"><div><strong>${esc(t)}</strong><p>${t==='Project Hub AI'?'由应用加载技能；执行依赖工具能力':'全局或指定项目 · 路径由适配器检测'}</p><span class="${on?'target-status':'muted small'}">${on?'已安装（示例状态）':'尚未安装'}</span></div><div class="actions"><button type="button" data-target="${esc(t)}">${on?'移除示例安装':'模拟安装'}</button></div></div>`}).join('')}`;
 if(tab==='history')body=`<h3>当前修订</h3><p class="muted small">${esc(s.version)} · ${esc(s.source)}</p><h3>${s.update?'有可用更新（示例）':'更新状态'}</h3><p class="muted small">${s.source==='GitHub'?'更新前查看来源提交、文件差异和本地修改，备份后替换。':'本地技能可重新导入；已有技能更新由来源工具决定。'}</p><button id="compare" type="button">查看更新差异</button><h3>操作历史</h3><p class="muted small">正式管理器记录导入、安装、停用、更新和恢复。</p>`;
 $('detail').innerHTML=`<header class="detail-head"><div class="row-top"><h2>${esc(s.title)}</h2><span class="pill">${esc(s.category)}</span></div><span class="slug">${esc(s.id)}</span><div class="tabs" role="tablist" aria-label="技能详情">${[['overview','概览'],['content','内容'],['targets','安装位置'],['history','更新与历史']].map(([v,l])=>`<button type="button" role="tab" aria-selected="${tab===v}" class="tab ${tab===v?'active':''}" data-tab="${v}">${l}</button>`).join('')}</div></header><div class="detail-body">${body}</div><footer class="detail-bottom"><span class="muted small">安装时保留完整目录</span><div class="actions"><button id="explain" type="button">AI 解读用途</button><button id="install-selected" class="primary" type="button">管理安装</button></div></footer>`;
}
function renderSource(type){
 if(type==='github')$('import-source').innerHTML='<label class="field">GitHub 仓库、目录或文件链接<input id="source-input" type="url" placeholder="https://github.com/owner/repo/tree/main/skills"></label><p class="small muted">仓库包含多个技能时，下一步选择需要导入的技能。</p>';
 if(type==='web')$('import-source').innerHTML='<label class="field">HTTPS 下载链接<input id="source-input" type="url" placeholder="https://example.com/my-skill.zip"></label><p class="small muted">支持技能 ZIP 或 SKILL.md；介绍网页需要提供实际下载地址。</p>';
 if(type==='local')$('import-source').innerHTML='<div class="import-box">选择技能文件夹、ZIP 或 SKILL.md<br><button id="local-pick" style="margin-top:12px" type="button">选择本地文件（演示）</button></div>';
 if(type==='existing')$('import-source').innerHTML='<div class="import-box">发现已安装的技能，无需重新下载。<p class="muted small">包括 github-release-desktop；插件提供的技能只读查看。</p><button id="existing-pick" type="button">选择已有技能（演示）</button></div>';
}
$('list').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b){selected=b.dataset.id;file='SKILL.md';renderList();renderDetail()}});
$('detail').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;renderDetail()}else if(b.dataset.file){file=b.dataset.file;renderDetail()}else if(b.dataset.target){const s=skills.find(s=>s.id===selected),t=b.dataset.target;if(s.installed.includes(t))s.installed=s.installed.filter(v=>v!==t);else s.installed.push(t);renderList();renderDetail();notify('已改变示例状态，未操作任何安装目录。')}else if(b.id==='install-selected'){tab='targets';renderDetail()}else if(b.id==='explain')notify('正式功能将使用配置的模型解读当前技能，并标明内容发送范围。') ;else if(b.id==='compare')notify('正式功能会显示上游与本地文件差异；此处未连接网络。')});
$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;for(const el of $('filters').children){el.classList.toggle('active',el===b);el.setAttribute('aria-selected',String(el===b))}renderList()});
['search','tool','source'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',renderList));
$('import').onclick=()=>{$('import-dialog').showModal()};$('close-dialog').onclick=$('cancel-import').onclick=()=>{$('import-dialog').close()};
$('import-tabs').addEventListener('click',e=>{const b=e.target.closest('[data-source]');if(!b)return;for(const el of $('import-tabs').children)el.classList.toggle('active',el===b);renderSource(b.dataset.source)});
$('import-source').addEventListener('click',e=>{if(e.target.closest('#local-pick'))notify('正式功能会打开本机文件/文件夹选择器。');if(e.target.closest('#existing-pick'))notify('正式功能会列出检测到的已有技能，支持选择后纳入管理。')});
$('scope').onchange=()=>{$('project-field').hidden=$('scope').value!=='project'};
$('preview-import').onclick=()=>{const chosen=[...$('import-dialog').querySelectorAll('.checks input:checked')].map(e=>e.value),scope=$('scope').value;if(scope!=='library'&&!chosen.length){notify('请选择至少一个安装目标，或选择仅加入技能库。');return}notify(scope==='library'?'演示：下一步识别技能并查看内容，仅收藏到技能库。':'演示：下一步预览技能与路径，再安装到 '+chosen.join('、'))};
$('scan').onclick=()=>notify('正式功能会扫描四个目标的技能目录；本预览没有读取本机文件。');$('theme').onclick=()=>document.documentElement.classList.toggle('light');
for(const b of document.querySelectorAll('.side-item:not(.active)'))b.onclick=()=>notify('当前展示 Skills 管理器页面布局，其他导航沿用现有应用。');
renderSource('github');renderList();renderDetail();
</script>
</body>
</html>
