appId: com.anpy.projecthub
productName: Project Hub
directories:
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: .packaging-data/project-hub.db
    to: data/project-hub.db
  - from: resources/bundled-skills
    to: bundled-skills
    filter:
      - '**/*'
      - '!**/.git/**'
      - '!**/node_modules/**'
      - '!**/.env'
      - '!**/.env.*'
beforePack: ./scripts/package-database.cjs
asar: true
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
